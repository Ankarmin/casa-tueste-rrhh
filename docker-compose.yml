services:
  postgres:
    image: postgres:16-alpine
    container_name: casa-tueste-rrhh-postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${DB_NAME:-rrhh_casa_tueste}
      POSTGRES_USER: ${DB_USER:-rrhh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rrhh_local_dev}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-rrhh} -d ${DB_NAME:-rrhh_casa_tueste}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - rrhh_postgres_data:/var/lib/postgresql/data

volumes:
  rrhh_postgres_data:
